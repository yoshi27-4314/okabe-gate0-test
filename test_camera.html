<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G-1: カメラ・QR読取</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f5f5f5; color: #222; padding: 16px;
  }
  h1 { font-size: 18px; margin-bottom: 12px; }
  video { width: 100%; max-width: 400px; border-radius: 8px; background: #000; }
  canvas { display: none; }
  .btn {
    display: block; width: 100%; padding: 14px; font-size: 15px;
    font-weight: 700; border: none; border-radius: 8px;
    cursor: pointer; margin-top: 12px;
  }
  .btn-start { background: #1a73e8; color: #fff; }
  .btn-stop { background: #e84a1a; color: #fff; }
  .btn:disabled { background: #ccc; }
  .counter {
    font-size: 48px; font-weight: 700; text-align: center;
    margin: 16px 0;
  }
  .status { font-size: 14px; color: #333; margin: 8px 0; }
  .log {
    background: #fff; border: 1px solid #ddd; border-radius: 8px;
    padding: 12px; font-size: 12px; max-height: 200px;
    overflow-y: auto; white-space: pre-wrap; margin-top: 12px;
  }
  .notice {
    background: #fff3cd; border: 1px solid #ffc107; border-radius: 8px;
    padding: 12px; font-size: 14px; margin-top: 12px; display: none;
  }
</style>
</head>
<body>

<h1>G-1: カメラ起動・QR読取・物理解放</h1>

<div class="counter" id="count">0 / 10</div>
<div class="status" id="status">待機中</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<button class="btn btn-start" id="btnStart" onclick="startCycle()">
  カメラ起動 → QR読取 → 停止（1サイクル）
</button>

<div class="notice" id="notice">
  10回連続完了しました。<br>
  ページを再読込（プルダウンリフレッシュ）して、<br>
  カメラ権限の再要求ダイアログが出ないことを確認してください。
</div>

<div class="log" id="log"></div>

<script>
var cycleCount = 0;
var stream = null;
var scanning = false;
var animId = null;

function log(msg) {
  var el = document.getElementById('log');
  var ts = new Date().toLocaleTimeString();
  el.textContent = '[' + ts + '] ' + msg + '\n' + el.textContent;
}

function setStatus(msg) {
  document.getElementById('status').textContent = msg;
}

function startCycle() {
  if (cycleCount >= 10) return;
  var btn = document.getElementById('btnStart');
  btn.disabled = true;
  setStatus('カメラ起動中...');
  log('Cycle ' + (cycleCount + 1) + ': カメラ起動要求');

  navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'environment' }
  })
  .then(function(s) {
    stream = s;
    var video = document.getElementById('video');
    video.srcObject = stream;
    video.play();
    setStatus('QRコードをかざしてください');
    log('Cycle ' + (cycleCount + 1) + ': カメラ起動成功');
    scanning = true;
    scanFrame();
  })
  .catch(function(err) {
    log('Cycle ' + (cycleCount + 1) + ': カメラ起動失敗 - ' + err.message);
    setStatus('カメラ起動失敗: ' + err.message);
    btn.disabled = false;
  });
}

function scanFrame() {
  if (!scanning) return;
  var video = document.getElementById('video');
  var canvas = document.getElementById('canvas');

  if (video.readyState !== video.HAVE_ENOUGH_DATA) {
    animId = requestAnimationFrame(scanFrame);
    return;
  }

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  var ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0);
  var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  var qr = jsQR(imageData.data, imageData.width, imageData.height);

  if (qr) {
    scanning = false;
    log('Cycle ' + (cycleCount + 1) + ': QR検出 -> "' + qr.data.substring(0, 50) + '"');
    stopCamera();
    return;
  }
  animId = requestAnimationFrame(scanFrame);
}

function stopCamera() {
  setStatus('カメラ停止中...');
  if (stream) {
    stream.getTracks().forEach(function(t) { t.stop(); });
    log('Cycle ' + (cycleCount + 1) + ': stream.getTracks().forEach(t => t.stop()) 実行');
    stream = null;
  }
  var video = document.getElementById('video');
  video.srcObject = null;

  if (animId) {
    cancelAnimationFrame(animId);
    animId = null;
  }

  cycleCount++;
  document.getElementById('count').textContent = cycleCount + ' / 10';
  log('Cycle ' + cycleCount + ': 完了');

  if (cycleCount >= 10) {
    setStatus('10回連続完了');
    document.getElementById('notice').style.display = 'block';
    document.getElementById('btnStart').style.display = 'none';
    log('=== 10回連続テスト完了 ===');
  } else {
    setStatus('次のサイクルを開始できます');
    document.getElementById('btnStart').disabled = false;
  }
}
</script>

</body>
</html>
